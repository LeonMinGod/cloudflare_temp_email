name: Authorized production operations
on:
  push:
    branches: [codex/free-token-home-20261024]
    paths: ['.github/production-request.json']
permissions:
  contents: write
  actions: write
concurrency:
  group: yifu-vps-production
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MONITOR_ROLE: source
      YIFU_SSH_HOST: ${{ secrets.YIFU_SSH_HOST }}
      YIFU_SSH_PORT: ${{ secrets.YIFU_SSH_PORT }}
      YIFU_SSH_USER: ${{ secrets.YIFU_SSH_USER }}
      YIFU_SSH_PRIVATE_KEY: ${{ secrets.YIFU_SSH_PRIVATE_KEY }}
      YIFU_SSH_KNOWN_HOSTS: ${{ secrets.YIFU_SSH_KNOWN_HOSTS }}
      YIFU_BACKUP_SECRET: ${{ secrets.YIFU_BACKUP_SECRET }}
      YIFU_OPS_SECRET: ${{ secrets.YIFU_OPS_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - run: python .github/scripts/production_io.py select
      - run: python -m pip install paramiko==4.0.0 cryptography==46.0.3 PyYAML==6.0.3 websocket-client==1.9.0
      - if: env.OPS_MODE == 'linuxserver-mobile-inspect' || env.OPS_MODE == 'browser-publish' || env.OPS_MODE == 'linuxserver-publish'
        run: python -m pip install playwright==1.64.1
      - if: env.OPS_MODE == 'linuxserver-publish'
        run: node .github/scripts/test_browser_proxy.mjs
      - run: python .github/scripts/production_ops.py
      - if: always() && env.OPS_REQUEST_ID != ''
        run: python .github/scripts/production_io.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-ops-${{ github.run_id }}
          path: production-operation/
          retention-days: 14
          if-no-files-found: ignore
