name: Operate Yifu public CPA VPS
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [verify-stage, verify, status, deploy-monitor, publish-guard, configure-pool, seed-pool, backup, apply-safety, verify-safety, rollback-safety, deploy-plus, verify-plus, finalize-plus]
        default: verify
permissions:
  contents: read
concurrency:
  group: yifu-vps-production
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YIFU_SSH_HOST: ${{ secrets.YIFU_SSH_HOST }}
      YIFU_SSH_PORT: ${{ secrets.YIFU_SSH_PORT }}
      YIFU_SSH_USER: ${{ secrets.YIFU_SSH_USER }}
      YIFU_SSH_PRIVATE_KEY: ${{ secrets.YIFU_SSH_PRIVATE_KEY }}
      YIFU_SSH_KNOWN_HOSTS: ${{ secrets.YIFU_SSH_KNOWN_HOSTS }}
      YIFU_BACKUP_SECRET: ${{ secrets.YIFU_BACKUP_SECRET }}
      YIFU_OPS_SECRET: ${{ secrets.YIFU_OPS_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YIFU_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/free-token-home-20261024
      - uses: actions/setup-node@v6
        if: inputs.mode == 'deploy-monitor' || inputs.mode == 'publish-guard'
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        if: inputs.mode == 'apply-safety'
        with:
          go-version: '1.26'
          cache: false
      - name: Test and build the bounded admission gateway in CI
        if: inputs.mode == 'apply-safety'
        working-directory: sites/yifu-vps-gateway
        run: |
          go test -race ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/yifu-gateway" .
      - if: inputs.mode == 'deploy-monitor'
        run: node --test sites/yifu-vps-monitor/tests/*.test.mjs
      - if: inputs.mode == 'publish-guard'
        working-directory: sites/api-abuse-guard
        run: |
          npm ci --ignore-scripts
          npm test
      - run: python -m pip install paramiko pyyaml cryptography
      - name: Validate backup format and safety configuration
        run: python -m unittest discover -s .github/scripts/tests -p test_yifu_safety.py -v
      - name: Download the pinned native CPAMP release
        if: inputs.mode == 'deploy-plus'
        run: curl --fail --location --retry 2 --output cpamp-native.tar.gz https://github.com/seakee/CPA-Manager-Plus/releases/download/v1.14.10/cpa-manager-plus_v1.14.10_linux_amd64.tar.gz
      - if: inputs.mode == 'deploy-plus' || inputs.mode == 'verify-plus' || inputs.mode == 'finalize-plus'
        run: python .github/scripts/yifu_plus.py
      - if: inputs.mode != 'deploy-plus' && inputs.mode != 'verify-plus' && inputs.mode != 'finalize-plus'
        run: python .github/scripts/yifu_vps.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yifu-vps-${{ github.run_id }}
          path: yifu-operation/
          if-no-files-found: ignore
          retention-days: 90
