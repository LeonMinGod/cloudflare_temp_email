name: Operate CPA on InstaBox
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, restore, deploy-gateway, deploy-guard-origin, status, verify, stream-probe, refresh-active, diagnose, backup]
        default: inspect
permissions:
  contents: read
  actions: read
concurrency:
  group: cpa-instabox-production
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      INSTABOX_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: inputs.mode == 'deploy-guard-origin'
        with:
          node-version: 22
      - if: inputs.mode == 'deploy-guard-origin'
        working-directory: sites/api-abuse-guard
        run: |
          npm ci --ignore-scripts
          npm test
      - run: python -m pip install pyyaml cryptography
      - run: python .github/scripts/instabox_cpa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpa-instabox-operation-${{ github.run_id }}
          path: instabox-operation/
          if-no-files-found: ignore
          retention-days: 30
