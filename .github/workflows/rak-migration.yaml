name: RAK staged migration source
on:
  push:
    branches: [codex/free-token-home-20261024]
    paths: ['.github/migration-request.json']
permissions:
  contents: write
concurrency:
  group: yifu-vps-production
  cancel-in-progress: false
jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIGRATION_ROLE: source
      YIFU_SSH_HOST: ${{ secrets.YIFU_SSH_HOST }}
      YIFU_SSH_PORT: ${{ secrets.YIFU_SSH_PORT }}
      YIFU_SSH_USER: ${{ secrets.YIFU_SSH_USER }}
      YIFU_SSH_PRIVATE_KEY: ${{ secrets.YIFU_SSH_PRIVATE_KEY }}
      YIFU_SSH_KNOWN_HOSTS: ${{ secrets.YIFU_SSH_KNOWN_HOSTS }}
      YIFU_BACKUP_SECRET: ${{ secrets.YIFU_BACKUP_SECRET }}
      YIFU_OPS_SECRET: ${{ secrets.YIFU_OPS_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KEY_ENC_SECRET: ${{ secrets.KEY_ENC_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FREE_TOKEN_OPS_SECRET: ${{ secrets.FREE_TOKEN_OPS_SECRET }}
      FREE_TOKEN_TURNSTILE_SECRET: ${{ secrets.FREE_TOKEN_TURNSTILE_SECRET }}
      FREE_TOKEN_TURNSTILE_SITEKEY: ${{ secrets.FREE_TOKEN_TURNSTILE_SITEKEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - run: python .github/scripts/migration_io.py select
      - if: env.MIGRATION_MODE != 'none'
        run: python -m pip install paramiko==4.0.0 cryptography==46.0.3 PyYAML==6.0.3
      - if: env.MIGRATION_MODE != 'none'
        run: python .github/scripts/migration_inventory.py
      - if: always() && env.MIGRATION_REQUEST_ID != ''
        run: python .github/scripts/migration_io.py publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-${{ github.run_id }}
          path: migration-operation/
          if-no-files-found: ignore
          retention-days: 14
